name: LUXOR PHARAOH DAY — Bootstrap Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generate real package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Pin npm 11.19.0
        run: npm install --global npm@11.19.0

      - name: Verify runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile
        run: test -s package-lock.json

      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore(ci): generate real npm lockfile"
          git push origin HEAD:main
