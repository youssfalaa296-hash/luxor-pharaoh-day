name: LUXOR PHARAOH DAY — One-time lockfile refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'youssfalaa296-hash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --global npm@11.19.0
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          git config user.name "LUXOR PHARAOH DAY 🏺👑"
          git config user.email "youssfalaa296@gmail.com"
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git add package-lock.json
          git commit -m "chore: refresh lockfile for Playwright security update"
          git push origin HEAD:main
