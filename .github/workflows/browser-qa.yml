name: LUXOR PHARAOH DAY — Browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-qa:
    name: Chromium browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Start production server
        run: |
          npm run build
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/luxor-next.log 2>&1 &
          npx --yes wait-on@8.0.1 http://127.0.0.1:3000

      - name: Run browser QA
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx --yes playwright@1.63.0 test

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-evidence
          path: |
            playwright-report/
            test-results/
            /tmp/luxor-next.log
          if-no-files-found: ignore
